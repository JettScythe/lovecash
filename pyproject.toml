[project]
name = "lovecash"
version = "0.4.1"
description = "Performer-first toolkit linking Bitcoin Cash tips to Lovense toys."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "websockets>=13.0",
  "httpx>=0.27",
  "typer>=0.12",
  "pyyaml>=6.0",
  "rich>=13.8",
  "segno>=1.6",             # pure-python QR, native PNG/SVG, no PIL
  "hdwallet>=2.2,<3",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.31", "jinja2>=3.1"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest-cov>=7.1.0",
  "pre-commit>=4.6.0",
  "commitizen>=4.16.3",
  "types-pyyaml>=6.0.12.20260518",
]

[project.scripts]
lovecash = "lovecash.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lovecash"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs a live Electrum/Fulcrum server"]
addopts = "-m 'not integration'"

# ===== RUFF CONFIGURATION =====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.13
target-version = "py313"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E", "F", "I", "UP", "SIM", "B", "C4", "ASYNC", "S"]
ignore = ["E501", "E203"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Ignore rules that don't make sense to enforce for tests
"tests/*.py" = ["S101", "S104"]
"lovecash/bch/electrum.py" = ["S101"]
"lovecash/cli.py" = ["S104", "S501"]
"lovecash/lovense/controller.py" = ["S501"]

[tool.ruff.format]
# Use double quotes for strings.
quote-style = "double"

# Indent with spaces, rather than tabs.
indent-style = "space"

# Respect magic trailing commas.
skip-magic-trailing-comma = false

# Automatically detect the appropriate line ending.
line-ending = "auto"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"      # reads version from [project]
update_changelog_on_bump = true
major_version_zero = true        # keeps you in 0.x; breaking != 1.0 yet


[tool.mypy]
python_version = "3.14"
files = ["lovecash", "tests"]
strict = false                # start lenient; tighten over time
warn_unused_ignores = true
warn_redundant_casts = true
# The ecdsa lib has no type stubs and spams warnings; silence just it.
[[tool.mypy.overrides]]
module = ["ecdsa.*", "hdwallet.*", "segno.*"]
ignore_missing_imports = true
