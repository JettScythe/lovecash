name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Pin Python
        run: uv python install 3.14

      - name: Sync (with server extra + dev group)
        run: uv sync --extra server --group dev --frozen

      - name: Compile check (catches paste/syntax damage)
        run: uv run python -m compileall lovecash tests

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run --extra server pytest -v --tb=short
