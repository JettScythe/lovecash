# Copy to config.yaml and edit, or just run uv run lovecash init.
# NO PRIVATE KEYS GO HERE — only your wallet's xpub (Master PUBLIC Key).
# This tool never holds funds.

limits:
  # Hard caps on toy commands. These always win over rules — a rule
  # asking for more is clamped to these.
  max_strength: 12 # 0-20, your intensity ceiling
  max_duration_s: 30 # longest a single tip can run
  min_seconds_between_commands: 0.5 # rate limit; drops tip-spam

  # How concurrent tips are handled when several arrive at once.
  playback: queue # queue | override
                  #   queue: tips play in sequence, in full
                  #   override: newest tip interrupts current
  max_queue_seconds: 30 # if the backlog exceeds this, trim it
  trim_strategy: compress # how to trim an overlong queue:
                  #   compress: shrink durations, keep all
                  #   drop_oldest: drop the oldest queued
                  #   drop_newest: reject the incoming tip
  min_compressed_duration_s: 1.0 # compress never shrinks below this

lovense:
  host: "127.0.0.1" # the Lovense Connect app's address
  port: 30010
  use_https: true
  toy_id: null # null = use the first connected toy

  # Multiple toys: list each with its id (from `lovecash doctor`) and
  # optional per-toy limit overrides, then target rules with `toy:`.
  # toys:
  #   - toy_id: "428ecdba..."
  #     max_strength: 15
  #   - toy_id: "9f2c1a..."

bch:
  # Your wallet's xpub (Master Public Key). PUBLIC key only — lovecash
  # derives receiving addresses and can never spend. Never an xprv/seed.
  xpub: null
  derivation_branch: 0 # 0 = external/receive chain (standard)
  gap_limit: 20 # unused addresses watched ahead of the last used
  rotate_on_payment: true # show a fresh address after each tip (privacy)

  # --- How tips are credited: the safety tiers ---
  # At/below zeroconf_max_sats:           credited instantly.
  # Between the thresholds, dsproof on:   short double-spend check, then credit.
  # At/above EITHER ceiling (sats or USD, whichever is lower): wait for a block.
  # Any detected double-spend, any value: wait for a block.
  zeroconf_max_sats: 100000 # instant tier ceiling (in satoshis)
  always_confirm_above_sats: 100000000 # 1 BCH: always wait for a block above
                  # this, regardless of price. A hard, dependency-free ceiling.

  # Double-spend proof verification (lets mid-range tips credit in seconds
  # instead of waiting ~10 min for a block). Requires a DSProof-capable
  # Electrum server (the defaults below are). Falls back to waiting for a
  # confirmation if unavailable.
  dsproof_enabled: true
  dsproof_window_seconds: 5.0 # how long to watch for a double-spend proof

  # Electrum/Fulcrum servers, tried in order with failover. At least one
  # required. All defaults below support DSProof.
  # tls_verify checks the server's TLS certificate (on by default) —
  # without it, someone on your network could inject fake tips. Only set
  # false for a trusted server with a self-signed certificate.
  servers:
    - host: "fulcrum.jettscythe.xyz"
      port: 50002
      ssl: true
      tls_verify: true
    - host: "cashnode.bch.ninja"
      port: 50002
      ssl: true
      tls_verify: true
    - host: "blackie.c3-soft.com"
      port: 50002
      ssl: true
      tls_verify: true

  # Connection health / reconnection tuning. Defaults are sane; rarely
  # need changing.
  heartbeat_seconds: 15.0 # detect a silently-dead connection
  reconnect_min_seconds: 1.0
  reconnect_max_seconds: 60.0

  # Optional: think in dollars instead of sats. When enabled, the USD
  # ceiling and the sats ceiling above BOTH apply — whichever is lower
  # (in sats terms) wins. Uses the General Protocols price oracle; if the
  # oracle is unavailable, the sats ceiling alone applies (safe fallback).
  pricing:
    enabled: true
    always_confirm_above_usd: 500 # wait for a block above this dollar value
    zeroconf_max_usd: null # optional USD version of the instant floor
    refresh_seconds: 60 # how often to refresh the price
    max_staleness_seconds: 180 # older than this -> fall back to sats
    verify_signature: true # verify the oracle's signed price locally

server:
  # The OBS overlay relay. Off here means run `lovecash run` (no overlay).
  enabled: false
  bind_host: "127.0.0.1" # use 0.0.0.0 only WITH a relay_token set
  bind_port: 8080
  relay_token: null # required if bind_host is public; protects
                  # the /panic and /resume control endpoints

rules:
  - name: hello
    min_sats: 500
    max_sats: 1999
    action: Thrusting
    strength: 2
    duration_s: 3
  - name: tease
    min_sats: 2000
    max_sats: 4999
    action: Thrusting
    strength: 5
    duration_s: 5
  - name: warmup
    min_sats: 5000
    max_sats: 9999
    action: Thrusting
    strength: 8
    duration_s: 8
  - name: steady
    min_sats: 10000
    max_sats: 24999
    action: Thrusting
    strength: 11
    duration_s: 12
  - name: build
    min_sats: 25000
    max_sats: 49999
    action: Thrusting
    strength: 14
    duration_s: 15
  - name: intense
    min_sats: 50000
    max_sats: 99999
    action: Thrusting
    strength: 17
    duration_s: 20
  - name: maximum
    min_sats: 100000
    action: Thrusting
    strength: 20
    duration_s: 30

# --- CashToken tips (CHIP-2022-02) ---
# Uncomment to accept token tips. When any token_rules exist, the tip QR
# switches to a token-aware address so wallets can attach tokens.
# `category` is the token's 64-hex category ID (find it on an explorer —
# never trust a ticker alone). Amounts are BASE units (before decimals).
# require_conf: true (default) waits for 1 confirmation before firing,
# because a token's value isn't visible in its satoshi amount.
# token_rules:
#   - name: "fan-token-tease"
#     category: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
#     min_amount: 100
#     max_amount: 999
#     require_conf: true
#     action: Vibrate
#     strength: 6
#     duration_s: 5

# --- Phase 3: covenant goal show (optional) ---
# All-or-nothing tip goals enforced by a smart contract; lovecash watches
# the pot and fills the overlay goal bar from its on-chain balance.
# Pledges are NOT tips and never fire the toy. The address comes from
# contracts/address.mjs (the token address, starts with r...).
# See docs/covenant-goal-shows.md BEFORE using this with real funds.
# goal_show:
#   address: "bitcoincash:r..."
#   goal_sats: 500000
